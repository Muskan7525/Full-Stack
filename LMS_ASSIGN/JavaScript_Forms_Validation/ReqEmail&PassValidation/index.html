<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>..1..</h1>
    <h2>Student Registration Form</h2>
    <form>
      <label for="fullName">full name: </label>
      <input type="text" id="fullName" required />
      <br /><br />

      <label for="email">Email: </label>
      <input type="email" id="email" required />
      <br /><br />

      <label for="pw">Password: </label>
      <input type="password" id="pw" required minlength="8" maxlength="20" />
      <br /><br />

      <button type="button" onclick="checkEmail()">Check Email</button>
      <button type="button" onclick="checkPassword()">Check Password</button>
    </form>

    <h1>..2..</h1>
    <h2>Course Account Registration</h2>
    <form id="registrationForm">
      <label for="email">Email:</label>
      <input type="email" id="email" required />
      <br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        required
        minlength="8"
        maxlength="20"
      />
      <br /><br />

      <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
