
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Custom Styling</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5">

        <h1>..1..</h1>
        <h2>Customized Color Theme</h2>

        <button class="btn btn-primary">Get Started</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-warning">Warning</button>

        <hr>

        <h1>..2..</h1>
        <h2>Custom Component Styling</h2>

        <button class="btn btn-primary custom-btn">
            Custom Button
        </button>

        <div class="card custom-card mt-4" style="width: 300px;">
            <div class="card-body">

                <h5 class="card-title">Bootstrap Card</h5>

                <p class="card-text">
                    This is a Bootstrap card with custom styling.
                </p>

            </div>
        </div>

    </div>

</body>
</html>
