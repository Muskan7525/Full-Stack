<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Custom Styling</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h1>..1..</h1>
      <h2 class="text-center mb-4">Customized Color Theme</h2>

      <div class="text-center mb-5">
        <button class="btn btn-primary">Get Started</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-warning">Warning</button>
      </div>

      <hr />

      <h1>..2..</h1>
      <h2 class="text-center my-4">Custom Component Styling</h2>

      <div class="text-center mb-4">
        <button class="btn btn-primary custom-btn">Custom Button</button>
      </div>

      <div class="card custom-card mx-auto" style="max-width: 350px">
        <div class="card-body text-center">
          <h5 class="card-title">Bootstrap Card</h5>

          <p class="card-text">
            This card uses custom CSS styling with Bootstrap classes.
          </p>

          <button class="btn btn-primary">Learn More</button>
        </div>
      </div>
    </div>
  </body>
</html>
