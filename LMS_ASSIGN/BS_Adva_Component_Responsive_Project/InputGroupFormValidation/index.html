<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Input Groups</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5 mb-5">
      <h2 class="text-center text-danger mb-4">Bootstrap Input Groups</h2>
      <div class="card p-4 mb-4 shadow-sm">
        <h4 class="mb-4">1. Bootstrap Input Groups</h4>

        <label class="form-label">Username</label>
        <div class="input-group mb-3">
          <span class="input-group-text">@</span>
          <input
            type="text"
            class="form-control"
            placeholder="Enter username"
          />
        </div>

        <label class="form-label">Website Address</label>
        <div class="input-group mb-3">
          <span class="input-group-text">https://</span>
          <input type="text" class="form-control" placeholder="Enter website" />
        </div>

        <label class="form-label">Search Course</label>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Search course" />
          <button class="btn btn-primary" type="button">Search</button>
        </div>

        <label class="form-label">Email Subscription</label>
        <div class="input-group mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
          />
          <button class="btn btn-success" type="button">Subscribe</button>
        </div>
      </div>

    <!--  -->
      <div class="card p-4 shadow-sm">
        <h4 class="mb-4">2. Bootstrap Form Validation</h4>

        <label class="form-label">Valid Email Address</label>
        <input
          type="email"
          class="form-control is-valid"
          value="student@gmail.com"
        />

        <div class="valid-feedback mb-3">Email address is valid!</div>

        <label class="form-label">Invalid Email Address</label>
        <input
          type="email"
          class="form-control is-invalid"
          value="student123"
        />

        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>
    </div>
  </body>
</html>
