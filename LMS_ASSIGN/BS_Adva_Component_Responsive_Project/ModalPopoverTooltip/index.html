<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Modals</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    
    <div class="container mt-5">
       <h1>..1..</h1>
      <h2>Bootstrap Course</h2>
      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#courseModal"
      >
        View Course
      </button>

      <button
        class="btn btn-danger"
        data-bs-toggle="modal"
        data-bs-target="#deleteModal"
      >
        Delete Course
      </button>

      <div class="modal fade" id="courseModal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Web Development Course</h5>
              <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              Learn HTML, CSS, JavaScript and Bootstrap.
            </div>

            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">
                Close
              </button>

              <button class="btn btn-success" data-bs-dismiss="modal">
                Start Course
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal fade" id="deleteModal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Delete Course</h5>
              <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              Are you sure you want to delete this course?
            </div>

            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">
                Cancel
              </button>

              <button class="btn btn-danger" data-bs-dismiss="modal">
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>

      <hr />

      <h1>..2..</h1>
      <h2>Tooltip</h2>

      <button
        class="btn btn-primary"
        data-bs-toggle="tooltip"
        data-bs-title="This is a helpful message"
      >
        Hover Me
      </button>

      

      <h2>Popover</h2>

      <button
        class="btn btn-info"
        data-bs-toggle="popover"
        data-bs-title="Course Info"
        data-bs-content="Learn HTML, CSS, JavaScript and Bootstrap."
      >
        Course Info
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
