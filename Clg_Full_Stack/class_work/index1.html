<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BGI Addmission Form</title>
  </head>
  <body>
    <header>
      <h1>BGI Addmission Form</h1>
      <hr />
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Personal Details</legend>
          <p>
            <label for="firstName">First Name:</label>
            <input type="text" name="firstName" id="firstName" required />
          </p>

          <p>
            <label for="lastName">Last Name:</label>
            <input type="text" name="lastName" id="lastName" required />
          </p>

          <p>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required />
          </p>

          <p>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required />
          </p>

          <p>
            <label for="confirmPassword">Confirm Password:</label>
            <input
              type="password"
              name="confirmPassword"
              id="confirmPassword"
              required
            />
          </p>

          <p>
            <span>Gender:</span>
            <input type="radio" id="male" name="gender" value="male" />
            <span>Male</span>
            <input type="radio" id="female" name="gender" value="female" />
            <span>Female</span>
            <input type="radio" id="other" name="gender" value="other" />
            <span>Other</span>
          </p>

          <p>
            <label for="course">Course:</label>
            <select id="course" name="course" required>
              <option value="">-- Select a course --</option>
              <option value="computer-science">Computer Science</option>
              <option value="information-technology">
                Information Technology
              </option>
              <option value="AIML">AIML</option>
              <option value="web-development">Web Development</option>
            </select>
          </p>

          <p>
            <label for="dob">Date of Birth:</label>
            <input type="date" name="date_of_birth" id="dob" required />
          </p>
        </fieldset>

        <br />

        <fieldset>
          <legend>Contact Details</legend>
          <p>
            <label for="address">Full Address:</label><br />
            <textarea
              id="address"
              name="address"
              rows="4"
              cols="40"
              required
            ></textarea>
          </p>

          <p>
            <label for="contact">Contact Number:</label>
            <input
              type="tel"
              name="contact_number"
              id="contact"
              pattern="[0-9]{10}"
              maxlength="10"
              title="Enter a 10-digit contact number"
              required
            />
          </p>

          <p>
            <label for="pin-code">Pin Code:</label>
            <input
              type="text"
              name="pin_code"
              id="pin-code"
              pattern="[0-9]{6}"
              maxlength="6"
              title="Enter a 6-digit pin code"
              required
            />
          </p>

          <p>
            <label for="state">State:</label>
            <select id="state" name="state" required>
              <option value="">-- Select State --</option>
              <option value="MP">Madhya Pradesh</option>
              <option value="CG">Chattisgadh</option>
              <option value="Bihar">Bihar</option>
              <option value="Gujrat">Gujrat</option>
            </select>
          </p>

          <p>
            <label for="district">District:</label>
            <select id="district" name="district" required>
              <option value="">-- Select district--</option>
              <option value="Bhopal">Bhopal</option>
              <option value="indore">Indore </option>
              <option value="umaria">Umaria</option>
              <option value="katni">Katni</option>
            </select>
          </p>
        </fieldset>

        <p>
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </p>
      </form>
    </main>
  </body>
</html>
